global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
rule_files: ["/etc/prometheus/rules.yaml"]
scrape_configs:
  - job_name: vetnotify
    static_configs: [{targets: ["api:8080"]}]
  - job_name: outside-probe
    static_configs: [{targets: ["probe:8080"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
