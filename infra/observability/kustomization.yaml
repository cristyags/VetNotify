apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: vetnotify-observability
    files:
      - collector.yaml
      - jaeger.yaml
      - prometheus.yaml
      - rules.yaml
      - datasources.yaml=grafana/provisioning/datasources/default.yaml
      - dashboards.yaml=grafana/provisioning/dashboards/default.yaml
      - operations.json=grafana/dashboards/operations.json
