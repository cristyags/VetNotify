---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "web",
    "labels": {
      "app": "web",
      "app.kubernetes.io/part-of": "vetnotify"
    }
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 4,
    "progressDeadlineSeconds": 150,
    "selector": {
      "matchLabels": {
        "app": "web"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "web",
          "app.kubernetes.io/part-of": "vetnotify"
        }
      },
      "spec": {
        "serviceAccountName": "vetnotify-app",
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "web",
            "image": "vetnotify-web:local",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "runAsUser": 101,
              "runAsGroup": 101,
              "readOnlyRootFilesystem": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "20Mi"
              },
              "limits": {
                "cpu": "150m",
                "memory": "80Mi"
              }
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8080
              },
              "periodSeconds": 3,
              "failureThreshold": 30,
              "timeoutSeconds": 3
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 8080
              },
              "periodSeconds": 4,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8080
              },
              "periodSeconds": 10,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            }
          }
        ]
      }
    }
  }
}
