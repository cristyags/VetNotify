    }
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 4,
    "progressDeadlineSeconds": 150,
    "selector": {
      "matchLabels": {
        "app": "node-exporter"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "node-exporter",
          "app.kubernetes.io/part-of": "vetnotify"
        }
      },
      "spec": {
        "serviceAccountName": "vetnotify-app",
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "node-exporter",
            "image": "prom/node-exporter:v1.11.1",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 9100
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "runAsUser": 65534,
              "runAsGroup": 65534,
              "readOnlyRootFilesystem": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "20Mi"
              },
              "limits": {
                "cpu": "130m",
                "memory": "70Mi"
              }
            },
            "args": [
              "--collector.disable-defaults",
              "--collector.cpu",
              "--collector.meminfo"
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/",
                "port": 9100
              },
              "periodSeconds": 4,
              "failureThreshold": 15,
              "timeoutSeconds": 3
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/",
                "port": 9100
              },
              "periodSeconds": 6,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/",
                "port": 9100
              },
              "periodSeconds": 15,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            }
          }
        ]
      }
    }
  }
}
