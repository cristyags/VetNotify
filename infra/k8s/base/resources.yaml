---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "gateway",
    "labels": {
      "app": "gateway",
      "app.kubernetes.io/part-of": "vetnotify"
    }
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 4,
    "progressDeadlineSeconds": 150,
    "selector": {
      "matchLabels": {
        "app": "gateway"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "gateway",
          "app.kubernetes.io/part-of": "vetnotify"
        }
      },
      "spec": {
        "serviceAccountName": "vetnotify-app",
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "gateway",
            "image": "nginx:1.30.4-alpine",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "runAsUser": 101,
              "runAsGroup": 101,
              "readOnlyRootFilesystem": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "15m",
                "memory": "20Mi"
              },
              "limits": {
                "cpu": "250m",
                "memory": "80Mi"
              }
            },
            "command": [
              "nginx",
              "-g",
              "daemon off;"
            ],
            "volumeMounts": [
              {
                "name": "gateway-config",
                "mountPath": "/etc/nginx/nginx.conf",
                "subPath": "nginx.conf",
                "readOnly": true
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/gateway/live",
                "port": 8080
              },
              "periodSeconds": 3,
              "failureThreshold": 30,
              "timeoutSeconds": 3
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/gateway/live",
                "port": 8080
              },
              "periodSeconds": 4,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/gateway/live",
                "port": 8080
              },
              "periodSeconds": 10,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            }
          }
        ],
        "volumes": [
          {
            "name": "gateway-config",
            "configMap": {
              "name": "vetnotify-gateway"
            }
          }
        ]
      }
    }
  }
}
