---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "api",
    "labels": {
      "app": "api",
      "app.kubernetes.io/part-of": "vetnotify"
    }
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 4,
    "progressDeadlineSeconds": 150,
    "selector": {
      "matchLabels": {
        "app": "api"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "api",
          "app.kubernetes.io/part-of": "vetnotify"
        }
      },
      "spec": {
        "serviceAccountName": "vetnotify-app",
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "api",
            "image": "vetnotify-backend:local",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "readOnlyRootFilesystem": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "30m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              }
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8080
              },
              "periodSeconds": 3,
              "failureThreshold": 30,
              "timeoutSeconds": 3
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 8080
              },
              "periodSeconds": 4,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8080
              },
              "periodSeconds": 10,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            },
            "env": [
              {
                "name": "VET_ENV",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "vetnotify-config",
                    "key": "VET_ENV"
                  }
                }
              },
              {
                "name": "DEMO_FAULTS",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "vetnotify-config",
                    "key": "DEMO_FAULTS"
                  }
                }
              },
              {
                "name": "DATABASE_URL",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "vetnotify-database",
                    "key": "url"
                  }
                }
              },
              {
                "name": "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT",
                "value": "http://collector:4318/v1/traces"
              },
              {
                "name": "PUBLIC_ORIGIN",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "vetnotify-config",
                    "key": "PUBLIC_ORIGIN"
                  }
                }
              },
              {
                "name": "IMAGE_REF",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "vetnotify-config",
                    "key": "IMAGE_REF"
                  }
                }
              },
              {
                "name": "AGENDA_URL",
                "value": "http://agenda:8080"
              },
              {
                "name": "LAB_URL",
                "value": "http://laboratorio:8080"
              },
              {
                "name": "ADAPTER_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "vetnotify-adapter",
                    "key": "key"
                  }
                }
              }
            ]
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
