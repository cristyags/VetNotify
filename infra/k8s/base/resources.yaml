{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "probe",
    "labels": {
      "app": "probe",
      "app.kubernetes.io/part-of": "vetnotify"
    }
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 4,
    "progressDeadlineSeconds": 150,
    "selector": {
      "matchLabels": {
        "app": "probe"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "probe",
          "app.kubernetes.io/part-of": "vetnotify"
        }
      },
      "spec": {
        "serviceAccountName": "vetnotify-app",
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "probe",
            "image": "vetnotify-backend:local",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "readOnlyRootFilesystem": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "250m",
                "memory": "128Mi"
              }
            },
            "command": [
              "node",
              "scripts/probe.mjs"
            ],
            "env": [
              {
                "name": "VET_ENV",
                "valueFrom": {
                  "configMapKeyRef": {
                    "name": "vetnotify-config",
                    "key": "VET_ENV"
                  }
                }
              },
              {
                "name": "API_URL",
                "value": "http://gateway:8080"
              },
              {
                "name": "AGENDA_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "vetnotify-agenda",
                    "key": "key"
                  }
                }
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8080
              },
              "periodSeconds": 3,
              "failureThreshold": 30,
              "timeoutSeconds": 3
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8080
              },
              "periodSeconds": 5,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8080
              },
              "periodSeconds": 15,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            }
          }
        ]
      }
    }
  }
}
