---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "postgres",
    "labels": {}
  },
  "spec": {
    "replicas": 1,
    "serviceName": "postgres",
    "selector": {
      "matchLabels": {
        "app": "postgres"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "postgres"
        }
      },
      "spec": {
        "serviceAccountName": "vetnotify-app",
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "securityContext": {
          "fsGroup": 999,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "postgres",
            "image": "postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 5432
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "runAsUser": 999,
              "runAsGroup": 999,
              "readOnlyRootFilesystem": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "120m",
                "memory": "192Mi"
              },
              "limits": {
                "cpu": "850m",
                "memory": "640Mi"
              }
            },
            "env": [
              {
                "name": "POSTGRES_USER",
                "value": "vetnotify"
              },
              {
                "name": "POSTGRES_DB",
                "value": "vetnotify"
              },
              {
                "name": "POSTGRES_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "vetnotify-database",
                    "key": "password"
                  }
                }
              }
            ],
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/postgresql"
              }
            ],
            "startupProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-ec",
                  "pg_isready -U vetnotify -d vetnotify"
                ]
              },
              "periodSeconds": 3,
              "failureThreshold": 40
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-ec",
                  "pg_isready -U vetnotify -d vetnotify"
                ]
              },
              "periodSeconds": 3
            },
            "livenessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-ec",
                  "pg_isready -U vetnotify -d vetnotify"
                ]
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3
            }
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "storageClassName": "local-path",
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "8Gi"
            }
          }
        }
      }
    ]
  }
}
