                    "key": "password"
                  }
                }
              },
              {
                "name": "GF_AUTH_ANONYMOUS_ENABLED",
                "value": "false"
              },
              {
                "name": "GF_ANALYTICS_REPORTING_ENABLED",
                "value": "false"
              },
              {
                "name": "GF_ANALYTICS_CHECK_FOR_UPDATES",
                "value": "false"
              },
              {
                "name": "GF_PLUGINS_PREINSTALL_DISABLED",
                "value": "true"
              }
            ],
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/etc/grafana/provisioning/datasources/vetnotify.yaml",
                "subPath": "datasources.yaml",
                "readOnly": true
              },
              {
                "name": "config",
                "mountPath": "/etc/grafana/provisioning/dashboards/vetnotify.yaml",
                "subPath": "dashboards.yaml",
                "readOnly": true
              },
              {
                "name": "config",
              "mountPath": "/var/lib/grafana/dashboards/operations.json",
                "subPath": "operations.json",
                "readOnly": true
              },
              {
                "name": "data",
                "mountPath": "/var/lib/grafana"
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": 3000
              },
              "periodSeconds": 4,
              "failureThreshold": 25,
              "timeoutSeconds": 3
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": 3000
              },
              "periodSeconds": 5,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/api/health",
                "port": 3000
              },
              "periodSeconds": 15,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            }
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "vetnotify-observability"
            }
          },
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "grafana-data"
            }
          }
        ]
      }
    }
  }
}
