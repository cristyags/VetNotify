apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vetnotify-prod
resources: [namespace.yaml, ../../base]
patches:
  - target:
      kind: ConfigMap
      name: vetnotify-config
    patch: |-
      - op: replace
        path: /data/VET_ENV
        value: prod
      - op: replace
        path: /data/DEMO_FAULTS
        value: "false"
      - op: replace
        path: /data/PUBLIC_ORIGIN
        value: https://replace.vetnotify.invalid
  - target:
      kind: Service
      name: gateway
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31081
