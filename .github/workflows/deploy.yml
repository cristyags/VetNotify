name: Entrega controlada
on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Ejecución de Publicar candidato desde main
        type: string
        required: true
      production_pr:
        description: PR de autorización de producción ya integrado en main
        type: string
        required: false
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: vetnotify-release
  cancel-in-progress: false
jobs:
  verify-release:
    if: github.ref == 'refs/heads/main' && vars.VETNOTIFY_PROMOTION_ENABLED == 'configured'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      backend: ${{ steps.release.outputs.backend }}
      web: ${{ steps.release.outputs.web }}
    steps:
      - name: Verify source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: |
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN")
          jq -e '.name=="Publicar candidato" and .head_branch=="main" and .conclusion=="success"' <<< "$run"
          echo "commit=$(jq -r .head_sha <<< "$run")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ steps.source.outputs.commit }}
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
      - id: release
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          [[ $(jq -r .commit release.json) == "$EXPECTED_COMMIT" ]]
          for image in backend web; do
            ref=$(jq -r ".$image" release.json)
            prefix="ghcr.io/${GITHUB_REPOSITORY,,}-$image@sha256:"
            [[ "$ref" == "$prefix"* ]]
            [[ "${ref##*:}" =~ ^[0-9a-f]{64}$ ]]
            echo "$image=$ref" >> "$GITHUB_OUTPUT"
          done
  validation:
    needs: verify-release
    runs-on: [self-hosted, vetnotify-deploy]
    environment: validation
    steps:
      - env:
          KUBE_CONTEXT: vetnotify-dev-release
          BACKEND: ${{ needs.verify-release.outputs.backend }}
          WEB: ${{ needs.verify-release.outputs.web }}
          COMMIT: ${{ needs.verify-release.outputs.commit }}
          BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: /opt/vetnotify/promote.sh vetnotify-dev
  authorize-production:
    needs: [verify-release, validation]
    if: inputs.production_pr != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Verify independently reviewed promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR: ${{ inputs.production_pr }}
          COMMIT: ${{ needs.verify-release.outputs.commit }}
          BACKEND: ${{ needs.verify-release.outputs.backend }}
          WEB: ${{ needs.verify-release.outputs.web }}
        run: |
          [[ "$PROMOTION_PR" =~ ^[0-9]+$ ]]
          repo="repos/$GITHUB_REPOSITORY"
          gh api "$repo/branches/main" --jq '.protected' | grep -Fx true
          pr=$(gh api "$repo/pulls/$PROMOTION_PR")
          jq -e '.merged and .base.ref=="main"' <<< "$pr"
          head=$(jq -r .head.sha <<< "$pr")
          author=$(jq -r .user.login <<< "$pr")
          merge=$(jq -r .merge_commit_sha <<< "$pr")
          gh api "$repo/pulls/$PROMOTION_PR/files" | jq -e '[.[].filename] == ["releases/production.json"]'
          gh api --paginate --slurp "$repo/pulls/$PROMOTION_PR/reviews" |
            jq -e --arg head "$head" --arg author "$author" '
              flatten | any(.state=="APPROVED" and .commit_id==$head and .user.login!=$author
                and (.author_association=="MEMBER" or .author_association=="OWNER" or .author_association=="COLLABORATOR"))
            '
          gh api "$repo/contents/releases/production.json?ref=$merge" --jq .content | base64 -d |
            jq -e --arg commit "$COMMIT" --arg backend "$BACKEND" --arg web "$WEB" +              '.commit==$commit and .backend==$backend and .web==$web'
  production:
    needs: [verify-release, validation, authorize-production]
    runs-on: [self-hosted, vetnotify-deploy]
    environment: production
    steps:
      - env:
          KUBE_CONTEXT: vetnotify-prod-release
          BACKEND: ${{ needs.verify-release.outputs.backend }}
          WEB: ${{ needs.verify-release.outputs.web }}
          COMMIT: ${{ needs.verify-release.outputs.commit }}
          BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: /opt/vetnotify/promote.sh vetnotify-prod
