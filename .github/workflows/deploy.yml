name: Entrega controlada
on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Ejecución de Publicar candidato desde main
        type: string
        required: true
      production_pr:
        description: PR de autorización de producción ya integrado en main
        type: string
        required: true
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: vetnotify-release
  cancel-in-progress: false
jobs:
  verify-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      backend: ${{ steps.release.outputs.backend }}
      web: ${{ steps.release.outputs.web }}
    steps:
      - name: Verify source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: |
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN")
          jq -e '.path==".github/workflows/publish.yml" and .head_branch=="main" and .event=="push" and .conclusion=="success"' <<< "$run"
          echo "commit=$(jq -r .head_sha <<< "$run")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ steps.source.outputs.commit }}
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
      - id: release
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          [[ $(jq -r .commit release.json) == "$EXPECTED_COMMIT" ]]
          for image in backend web; do
            ref=$(jq -r ".$image" release.json)
            prefix="ghcr.io/${GITHUB_REPOSITORY,,}-$image@sha256:"
            [[ "$ref" == "$prefix"* ]]
            [[ "${ref##*:}" =~ ^[0-9a-f]{64}$ ]]
            echo "$image=$ref" >> "$GITHUB_OUTPUT"
          done
  authorize-production:
    needs: verify-release
    runs-on: ubuntu-24.04
    steps:
      - name: Verify independently reviewed promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR: ${{ inputs.production_pr }}
          COMMIT: ${{ needs.verify-release.outputs.commit }}
          BACKEND: ${{ needs.verify-release.outputs.backend }}
          WEB: ${{ needs.verify-release.outputs.web }}
        run: |
          [[ "$PROMOTION_PR" =~ ^[0-9]+$ ]]
          repo="repos/$GITHUB_REPOSITORY"
          gh api "$repo/branches/main" --jq '.protected' | grep -Fx true
          pr=$(gh api "$repo/pulls/$PROMOTION_PR")
          jq -e '.merged and .base.ref=="main"' <<< "$pr"
          head=$(jq -r .head.sha <<< "$pr")
          author=$(jq -r .user.login <<< "$pr")
          merge=$(jq -r .merge_commit_sha <<< "$pr")
          gh api "$repo/pulls/$PROMOTION_PR/files" | jq -e 'length==1 and .[0].filename=="releases/production.json"
            and (.[0].status=="added" or .[0].status=="modified")'
          gh api --paginate --slurp "$repo/pulls/$PROMOTION_PR/reviews" |
            jq -e --arg head "$head" --arg author "$author" '
              flatten | any(.state=="APPROVED" and .commit_id==$head and .user.login!=$author
                and (.author_association=="MEMBER" or .author_association=="OWNER" or .author_association=="COLLABORATOR"))
            '
          gh api "$repo/contents/releases/production.json?ref=$merge" --jq .content | base64 -d |
            jq -e --arg commit "$COMMIT" --arg backend "$BACKEND" --arg web "$WEB" \
              '.commit==$commit and .backend==$backend and .web==$web'
      - name: Confirm live validation and export authorization
        env:
          BACKEND: ${{ needs.verify-release.outputs.backend }}
          WEB: ${{ needs.verify-release.outputs.web }}
          COMMIT: ${{ needs.verify-release.outputs.commit }}
          BASE_URL: ${{ vars.DEV_BASE_URL }}
          RELEASE_RUN: ${{ inputs.release_run }}
          PROMOTION_PR: ${{ inputs.production_pr }}
        run: |
          [[ "$BASE_URL" == https://vetnotify-*.cloudapp.azure.com ]]
          curl --fail --silent --show-error --max-time 15 "$BASE_URL/health/ready" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$BASE_URL/" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$BASE_URL/api/v1/version" |
            jq -e --arg commit "$COMMIT" --arg image "$BACKEND" '.environment=="dev" and .commit==$commit and .image==$image'
          jq -n --arg commit "$COMMIT" --arg backend "$BACKEND" --arg web "$WEB" \
            --arg releaseRun "$RELEASE_RUN" --arg pr "$PROMOTION_PR" \
            '{commit:$commit,backend:$backend,web:$web,releaseRun:$releaseRun,pr:$pr}' > "$RUNNER_TEMP/vetnotify-authorization.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-${{ needs.verify-release.outputs.commit }}
          path: ${{ runner.temp }}/vetnotify-authorization.json
          retention-days: 5
