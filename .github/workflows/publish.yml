name: Publicar candidato
on:
  push:
    branches: [main, work/vetnotify]
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Require CI success at this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 110); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '[.workflow_runs[] | select(.name=="CI")][0].conclusion // ""')
            if [ "$state" = success ]; then exit 0; fi
            if [ -n "$state" ]; then echo "CI terminó con $state"; exit 1; fi
            sleep 10
          done
          exit 1
      - name: Build, scan, publish and export the same images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi
          auth="$RUNNER_TEMP/vetnotify-ghcr-auth.json"
          umask 077
          trap 'rm -f "$auth"' EXIT
          echo "$GH_TOKEN" | skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --driver docker-container --name vetnotify-builder --use
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p .runtime/release
          for component in backend web; do
            file=Dockerfile
            if [ "$component" = web ]; then file=Dockerfile.web; fi
            ref="$prefix-$component:$GITHUB_SHA"
            archive=".runtime/release/$component.oci.tar"
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
              -f "$file" --build-arg "REVISION=$GITHUB_SHA" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              -t "$ref" --output "type=oci,dest=$archive" --metadata-file "$RUNNER_TEMP/$component.json" .
            layout="$RUNNER_TEMP/$component-oci"
            mkdir "$layout"
            tar -xf "$archive" -C "$layout"
            docker run --rm -v "$layout:/scan:ro" aquasec/trivy:0.70.0 image \
              --input /scan --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
            skopeo copy --preserve-digests --authfile "$auth" "oci-archive:$archive" "docker://$ref"
            digest=$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/{print $2;exit}')
            test "${#digest}" -eq 71
            test "$digest" = "$(jq -r '.["containerimage.digest"]' "$RUNNER_TEMP/$component.json")"
            printf '%s\n' "${ref%:*}@$digest" > ".runtime/release/$component.ref"
          done
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --rawfile backend .runtime/release/backend.ref --rawfile web .runtime/release/web.ref \
            '{commit:$commit,run:$run,backend:($backend|rtrimstr("\n")),web:($web|rtrimstr("\n"))}' > .runtime/release/release.json
          cat .runtime/release/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.sha }}
          path: .runtime/release/release.json
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oci-${{ github.sha }}
          path: .runtime/release/*.oci.tar
          include-hidden-files: true
          compression-level: 0
          retention-days: 5
